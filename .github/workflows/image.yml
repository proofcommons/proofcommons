# image: build the verifier container and push it to ghcr.io as :latest and
# :epoch-<name>. The Dockerfile downloads the Mathlib cache and builds Statements/,
# which is why the timeout is generous. The package must be public so that
# verify.yml can pull it without credentials.
name: image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - lakefile.toml
      - lake-manifest.json
      - lean-toolchain
      - epoch.toml
      - "Statements/**"
      - "scripts/**"
      - AGENTS.md
      - .github/workflows/image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Free disk space on the runner
        # The image holds Mathlib's cache, several GB; the runner's default free
        # space is tight once the layers are exported. Remove preinstalled toolchains.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h / | tail -1

      - name: Set up Buildx
        # The runner's default builder ("docker" driver) cannot export a build cache;
        # this switches to the docker-container driver.
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read epoch name
        id: epoch
        run: |
          name=$(python3 -c 'import tomllib; print(tomllib.load(open("epoch.toml", "rb"))["name"])')
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/verifier:latest
            ghcr.io/${{ github.repository_owner }}/verifier:epoch-${{ steps.epoch.outputs.name }}
          # Cache in the registry next to the image instead of the Actions cache,
          # whose 10 GB limit the Mathlib layer alone would exhaust.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/verifier:latest
          cache-to: type=inline
