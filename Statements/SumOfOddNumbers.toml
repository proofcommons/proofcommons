id = "SumOfOddNumbers"
title = "The sum of the first n odd numbers"
lean_name = "ProofCommons.SumOfOddNumbers.Statement"
informal = """
For every natural number n,

    1 + 3 + 5 + ... + (2n - 1) = n^2.

Equivalently, the sum over i = 0, ..., n - 1 of (2i + 1) equals n^2.
"""
source = "Classical exercise. Chosen as the first statement to test the infrastructure."
